<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f9ff;
            color: #0f172a;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            padding: 10px;
            background-color: #1d4ed8;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0284c7;
        }

        a {
            color: #1d4ed8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
        p {
            text-align: center;
            margin-top: 15px;
        }
    </style>
  </head>
<body>
     <div class="container">
        <h1>Login</h1>
        <form action=""> 
            <label for="FullName">Enter Full Name</label>
            <input type="text" name="FullName" id="FullName" placeholder="Enter your full name" required>
            <br>
            <br>

            <label for="E-mail">Enter E-mail</label>
            <input type="email" name="E-mail" id="E-mail" placeholder="Enter your email" required>
            <br>
            <br>

            <label for="Password">Password</label>
            <input type="password" name="Password" id="Password" placeholder="Enter your password" required minlength="8">
            <br>
            <br>

            <input type="submit" value="Login">
        </form>

       <p> new user? <a href="registration.html">Register here</a></p>
</body>
</html>
