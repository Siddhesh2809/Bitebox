<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f9ff;
            color: #0f172a;
            padding: 20px;
        }

        .container {
            max-width: 20px;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            padding: 10px;
            background-color: #1d4ed8;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0284c7;
        }
        button {
            padding: 10px;
            background-color: #1d4ed8;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Customer Registration</h1>
    <form action=""> 
        <label for="FullName">Enter Full Name</label>
        <input type="text" name="FullName" id="FullName" placeholder="Enter your full name" required>
        <br>
        <br>

        <label for="E-mail">Enter E-mail</label>
        <input type="email" name="E-mail" id="E-mail" placeholder="Enter your email" required>
        <br>
        <br>

        <label for="Password">Password</label>
        <input type="password" name="Password" id="Password" placeholder="Enter your password" required minlength="8" charset="UTF-8">
        <br>
        <br>

        <label for="age">Enter Age</label>
        <input type="number" name="age" id="age" min="18" max="99">
<br>
<br>
        <label for="gender">Gender</label>
        <select name="Preference" id="Preference">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <br>
        <br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
